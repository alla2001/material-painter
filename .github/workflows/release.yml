# Pushing a version tag (v0.1.0, ...) builds the release on Windows (zip and
# installer), Linux (tarball) and macOS (universal .dmg), and attaches them to a draft GitHub release
# to review and publish by hand. Run it by hand (Actions → Release) to build some
# platforms again for an existing tag, e.g. after a runner failed.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to attach to (v0.1.6)"
        required: true
      platforms:
        description: "Platforms to build"
        default: "windows,linux,macos"

permissions:
  contents: write

jobs:
  windows:
    if: github.event_name == 'push' || contains(inputs.platforms, 'windows')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Build and package
        id: package
        shell: pwsh
        run: ./scripts/package.ps1
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.package.outputs.version }}" installer\material-painter.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
      # Signatures for the in-app updater, which installs only signed packages.
      - name: Sign for the updater
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: cargo run --release --locked --manifest-path tools/update-sign/Cargo.toml -- sign dist/MaterialPainter-*-windows-x64.zip dist/MaterialPainter-*-setup.exe
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/MaterialPainter-*-windows-x64.zip
            dist/MaterialPainter-*-windows-x64.zip.sig
            dist/MaterialPainter-*-setup.exe
            dist/MaterialPainter-*-setup.exe.sig

  linux:
    if: github.event_name == 'push' || contains(inputs.platforms, 'linux')
    # The oldest supported runner, so the build runs on older distributions too (glibc 2.35).
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Build and package
        run: ./scripts/package.sh
      # Signatures for the in-app updater, which installs only signed packages.
      - name: Sign for the updater
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: cargo run --release --locked --manifest-path tools/update-sign/Cargo.toml -- sign dist/MaterialPainter-*-linux-x64.tar.gz
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/MaterialPainter-*-linux-x64.tar.gz
            dist/MaterialPainter-*-linux-x64.tar.gz.sig

  macos:
    if: github.event_name == 'push' || contains(inputs.platforms, 'macos')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --locked
      - name: Build and package
        run: ./scripts/package-macos.sh
      # Signatures for the in-app updater, which installs only signed packages.
      - name: Sign for the updater
        shell: bash
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: cargo run --release --locked --manifest-path tools/update-sign/Cargo.toml -- sign dist/MaterialPainter-*-macos-universal.dmg
      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/MaterialPainter-*-macos-universal.dmg
            dist/MaterialPainter-*-macos-universal.dmg.sig
